[package]
name = "converge-soter-smt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SMT-backed safety and policy assurance suggestors for Converge."
keywords = ["converge", "smt", "cvc5", "verification", "policy"]
categories = ["algorithms"]
build = "build.rs"

[lib]
name = "soter"
path = "src/lib.rs"

[dependencies]
async-trait.workspace = true
converge-pack.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
soter-cvc5-sys = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
# remote-only deps (optional)
# tls-ring provides the rustls crypto provider; tls-webpki-roots bundles
# Mozilla CA roots so the client can validate Cloud Run's HTTPS cert. Without
# the roots feature the HTTPS handshake fails instantly with a generic
# "transport error" — discovered during M3 deploy when quorum-sense couldn't
# reach soter-server over the wire.
tonic       = { version = "0.14", features = ["tls-ring", "tls-webpki-roots"], optional = true }
tonic-prost = { version = "0.14", optional = true }
prost       = { version = "0.14", optional = true }
uuid        = { version = "1", features = ["v4"], optional = true }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
proptest.workspace = true

[features]
default = []
cvc5 = ["dep:soter-cvc5-sys", "soter-cvc5-sys/link"]
# Test-only scripted backend. Enables `ScriptedSmtBackend`. Never enable
# transitively from production code paths: a default-features build of soter
# has no concrete backend, forcing consumers to pick `cvc5` (real) or
# `fake-backend` (test) by intent.
fake-backend = []
# `remote` enables RemoteSmtBackend — a gRPC client implementing SmtBackend
# by calling a deployed soter-server. Marquee-apps in production use this.
# Mutually exclusive with `cvc5` at the marquee-app level (the M3 wiring in
# quorum-sense flips `cvc5` → `remote` cfg gates). Both features can be on
# in this crate simultaneously; the consumer picks which Backend impl to
# wire.
remote = ["dep:tonic", "dep:tonic-prost", "dep:prost", "dep:uuid"]

[[test]]
name = "suggestor"
required-features = ["fake-backend"]

[lints]
workspace = true
